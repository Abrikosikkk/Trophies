<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Novo Messenger</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-glass: rgba(255,255,255,0.05);
            --bg-glass-hover: rgba(255,255,255,0.08);
            --input-bg: rgba(255,255,255,0.04);
            --bubble-other: rgba(255,255,255,0.05);
            --accent: #8b5cf6;
            --accent-2: #ec4899;
            --accent-gradient: linear-gradient(135deg, #8b5cf6, #ec4899);
            --text-primary: #f1f1f4;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --success: #10b981;
            --danger: #ef4444;
            --border: rgba(255,255,255,0.08);
            --shadow-glow: 0 0 40px rgba(139,92,246,0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; overflow: hidden; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Background Orbs */
        .bg-orb { position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.4; z-index: 0; animation: float 20s ease-in-out infinite; pointer-events: none; }
        .bg-orb-1 { width: 400px; height: 400px; background: #8b5cf6; top: -100px; left: -100px; }
        .bg-orb-2 { width: 300px; height: 300px; background: #ec4899; bottom: -50px; right: -50px; animation-delay: -5s; }
        .bg-orb-3 { width: 250px; height: 250px; background: #3b82f6; top: 50%; left: 50%; animation-delay: -10s; }
        @keyframes float { 0%,100%{transform:translate(0,0) scale(1)} 33%{transform:translate(30px,-30px) scale(1.1)} 66%{transform:translate(-20px,20px) scale(0.9)} }
        body[data-theme="white"] .bg-orb { opacity: 0.12; }
        body[data-theme="black"] .bg-orb { opacity: 0.25; }

        /* App Frame */
        .app-frame {
            width: 100%;
            height: 100%;
            max-width: 480px;
            position: relative;
            background: var(--bg-primary);
            overflow: hidden;
            z-index: 1;
            display: flex;
            flex-direction: column;
        }
        @media (min-width: 520px) {
            .app-frame {
                height: 95vh;
                max-height: 900px;
                border-radius: 24px;
                border: 1px solid var(--border);
                box-shadow: 0 20px 80px rgba(0,0,0,0.6);
            }
        }

        /* Screens */
        .screen { display: none; width: 100%; height: 100%; position: relative; flex-direction: column; }
        .screen.active { display: flex; }

        /* Auth */
        .auth-scroll { flex: 1; overflow-y: auto; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-box {
            background: var(--bg-glass); backdrop-filter: blur(20px); border: 1px solid var(--border);
            border-radius: 24px; padding: 40px 32px; width: 100%; max-width: 380px;
            box-shadow: var(--shadow-glow); animation: fadeInUp 0.6s ease;
        }
        @keyframes fadeInUp { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:translateY(0)} }
        .auth-logo { text-align: center; margin-bottom: 28px; }
        .auth-logo h1 { font-size: 38px; font-weight: 700; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; letter-spacing: -1px; }
        .auth-logo p { color: var(--text-secondary); margin-top: 6px; font-size: 13px; }
        .auth-tabs { display: flex; gap: 6px; margin-bottom: 24px; background: var(--bg-glass); border-radius: 12px; padding: 4px; }
        .auth-tab { flex: 1; padding: 10px; border: none; background: transparent; color: var(--text-secondary); font-size: 14px; font-weight: 500; border-radius: 10px; cursor: pointer; transition: all 0.3s; font-family: inherit; }
        .auth-tab.active { background: var(--accent-gradient); color: white; box-shadow: 0 4px 15px rgba(139,92,246,0.3); }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 12px; font-weight: 500; color: var(--text-secondary); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-group input, .form-group textarea {
            width: 100%; padding: 14px 16px; background: var(--input-bg); border: 1px solid var(--border);
            border-radius: 14px; color: var(--text-primary); font-size: 15px; font-family: inherit;
            transition: all 0.3s; outline: none;
        }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(139,92,246,0.1); }
        .form-group input::placeholder, .form-group textarea::placeholder { color: var(--text-muted); }
        .btn-primary { width: 100%; padding: 14px; background: var(--accent-gradient); border: none; border-radius: 14px; color: white; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.3s; font-family: inherit; position: relative; overflow: hidden; }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 25px rgba(139,92,246,0.4); }
        .btn-primary:active { transform: translateY(0); }
        .error-msg { color: var(--danger); font-size: 13px; margin-top: 10px; text-align: center; display: none; }
        .error-msg.show { display: block; animation: shake 0.4s; }
        @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }

        /* Main Panels */
        .main-panel { display: none; flex-direction: column; height: 100%; overflow: hidden; }
        .main-panel.active { display: flex; }

        .screen-header {
            padding: 16px 20px; border-bottom: 1px solid var(--border);
            background: var(--bg-secondary); flex-shrink: 0;
        }
        .screen-header h2 { font-size: 22px; font-weight: 700; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

        /* Search */
        .search-wrap { padding: 12px 16px; position: relative; flex-shrink: 0; }
        .search-box { position: relative; }
        .search-box input { width: 100%; padding: 12px 16px 12px 42px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 14px; color: var(--text-primary); font-size: 14px; font-family: inherit; outline: none; transition: all 0.3s; }
        .search-box input:focus { border-color: var(--accent); }
        .search-box i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 14px; }
        .search-results { position: absolute; top: calc(100% + 6px); left: 16px; right: 16px; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 16px; max-height: 280px; overflow-y: auto; z-index: 100; display: none; box-shadow: 0 10px 40px rgba(0,0,0,0.4); }
        .search-results.show { display: block; }
        .search-result-item { padding: 12px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: all 0.2s; border-bottom: 1px solid var(--border); }
        .search-result-item:last-child { border-bottom: none; }
        .search-result-item:hover { background: var(--bg-glass-hover); }

        /* Chat List */
        .chat-list { flex: 1; overflow-y: auto; padding: 8px 12px 90px; }
        .chat-list::-webkit-scrollbar { width: 3px; }
        .chat-list::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; }
        .chat-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; cursor: pointer; transition: all 0.25s; margin-bottom: 4px; }
        .chat-item:hover { background: var(--bg-glass-hover); }
        .chat-item:active { transform: scale(0.98); }
        .chat-item.active { background: rgba(139,92,246,0.1); border: 1px solid rgba(139,92,246,0.2); }
        .chat-item .chat-info { flex: 1; min-width: 0; }
        .chat-item .chat-name { font-weight: 600; font-size: 15px; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-primary); }
        .chat-item .chat-preview { font-size: 13px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-item .chat-meta { text-align: right; flex-shrink: 0; }
        .chat-item .chat-time { font-size: 11px; color: var(--text-muted); margin-bottom: 3px; }
        .chat-item .unread { background: var(--accent-gradient); color: white; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 10px; display: inline-block; }
        .empty-state { text-align: center; padding: 50px 20px; color: var(--text-muted); }
        .empty-state i { font-size: 44px; margin-bottom: 14px; opacity: 0.4; }

        /* Avatar */
        .avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--accent-gradient); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 16px; color: white; flex-shrink: 0; overflow: hidden; position: relative; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-small { width: 40px; height: 40px; font-size: 15px; }
        .avatar-xl { width: 100px; height: 100px; font-size: 36px; }

        /* Chat Room Overlay */
        .chat-room {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg-primary); z-index: 50;
            transform: translateX(100%); transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
            display: flex; flex-direction: column;
        }
        .chat-room.show { transform: translateX(0); }

        .chat-room-header {
            padding: 14px 16px; border-bottom: 1px solid var(--border);
            background: var(--bg-secondary); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
        }
        .chat-room-header-info { display: flex; align-items: center; gap: 12px; }
        .chat-room-header-name { font-weight: 600; font-size: 16px; }
        .chat-room-header-status { font-size: 12px; color: var(--text-muted); }
        .chat-room-actions { display: flex; gap: 6px; position: relative; }
        .icon-btn {
            width: 38px; height: 38px; border-radius: 12px; border: none; background: var(--bg-glass);
            color: var(--text-secondary); cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; font-size: 15px;
        }
        .icon-btn:hover { background: var(--bg-glass-hover); color: var(--text-primary); }

        .dropdown-menu {
            position: absolute; top: calc(100% + 6px); right: 0;
            background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 16px;
            padding: 6px; min-width: 180px; box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            display: none; z-index: 200;
        }
        .dropdown-menu.show { display: block; animation: fadeIn 0.2s; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(-4px)} to{opacity:1;transform:translateY(0)} }
        .dropdown-item { padding: 10px 14px; border-radius: 10px; cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 10px; transition: all 0.2s; color: var(--text-primary); }
        .dropdown-item:hover { background: var(--bg-glass-hover); }
        .dropdown-item.danger { color: var(--danger); }

        .chat-room-messages {
            flex: 1; overflow-y: auto; padding: 16px 16px 80px; display: flex; flex-direction: column; gap: 2px;
        }
        .chat-room-messages::-webkit-scrollbar { width: 3px; }
        .chat-room-messages::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; }

        .message-group { display: flex; flex-direction: column; align-items: flex-start; max-width: 75%; margin-bottom: 6px; }
        .message-group.own { align-items: flex-end; align-self: flex-end; }
        .message-bubble { padding: 10px 14px; border-radius: 18px; font-size: 14px; line-height: 1.45; word-break: break-word; animation: msgIn 0.25s ease; }
        @keyframes msgIn { from{opacity:0;transform:translateY(8px) scale(0.96)} to{opacity:1;transform:translateY(0) scale(1)} }
        .message-group:not(.own) .message-bubble { background: var(--bubble-other); border: 1px solid var(--border); border-bottom-left-radius: 4px; color: var(--text-primary); }
        .message-group.own .message-bubble { background: var(--accent-gradient); border-bottom-right-radius: 4px; color: white; box-shadow: 0 4px 12px rgba(139,92,246,0.25); }
        .message-image { max-width: 260px; max-height: 260px; border-radius: 14px; cursor: pointer; transition: all 0.3s; border: 1px solid var(--border); display: block; }
        .message-image:hover { transform: scale(1.02); }
        .message-time { font-size: 11px; color: var(--text-muted); margin-top: 3px; padding: 0 4px; }
        .date-separator { text-align: center; margin: 14px 0; position: relative; }
        .date-separator span { background: var(--bg-primary); padding: 0 14px; font-size: 11px; color: var(--text-muted); position: relative; z-index: 1; }
        .date-separator::before { content: ''; position: absolute; top: 50%; left: 15%; right: 15%; height: 1px; background: var(--border); }

        .chat-room-input {
            padding: 10px 14px 14px; border-top: 1px solid var(--border);
            background: var(--bg-secondary); display: flex; align-items: flex-end; gap: 8px; flex-shrink: 0;
        }
        .input-wrapper { flex: 1; background: var(--input-bg); border: 1px solid var(--border); border-radius: 20px; padding: 3px; display: flex; align-items: flex-end; gap: 2px; transition: all 0.3s; }
        .input-wrapper:focus-within { border-color: var(--accent); }
        .chat-room-input textarea {
            flex: 1; background: transparent; border: none; padding: 10px 14px; color: var(--text-primary);
            font-size: 15px; font-family: inherit; outline: none; resize: none; max-height: 100px; min-height: 40px;
        }
        .chat-room-input textarea::placeholder { color: var(--text-muted); }
        .input-action { width: 36px; height: 36px; border-radius: 50%; border: none; background: transparent; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; margin-bottom: 2px; font-size: 18px; }
        .input-action:hover { color: var(--accent); background: rgba(139,92,246,0.08); }
        .send-btn { width: 40px; height: 40px; border-radius: 50%; border: none; background: var(--accent-gradient); color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; flex-shrink: 0; font-size: 15px; box-shadow: 0 4px 12px rgba(139,92,246,0.25); }
        .send-btn:active { transform: scale(0.92); }

        /* Bottom Nav */
        .bottom-nav {
            position: absolute; bottom: 0; left: 0; right: 0;
            display: flex; justify-content: space-around; align-items: center;
            padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
            background: var(--bg-glass); backdrop-filter: blur(24px);
            border-top: 1px solid var(--border); z-index: 40;
        }
        .nav-btn {
            width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--border);
            background: var(--bg-glass); color: var(--text-secondary);
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; cursor: pointer; transition: all 0.3s; backdrop-filter: blur(10px);
        }
        .nav-btn:hover { transform: translateY(-2px); background: var(--bg-glass-hover); }
        .nav-btn.active { background: var(--accent-gradient); color: white; border-color: transparent; box-shadow: 0 6px 20px rgba(139,92,246,0.35); transform: translateY(-4px); }

        /* Profile Screen */
        .profile-content { flex: 1; overflow-y: auto; padding: 24px 20px 100px; }
        .profile-avatar-section { text-align: center; margin-bottom: 24px; position: relative; }
        .profile-avatar-section .avatar { margin: 0 auto 10px; cursor: pointer; transition: all 0.3s; box-shadow: 0 8px 30px rgba(139,92,246,0.2); }
        .profile-avatar-section .avatar:hover { transform: scale(1.05); }
        .profile-avatar-hint { font-size: 12px; color: var(--text-muted); }
        .profile-field { margin-bottom: 18px; }
        .profile-field label { display: block; font-size: 12px; font-weight: 500; color: var(--text-secondary); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .profile-field .readonly { opacity: 0.6; cursor: not-allowed; background: var(--bg-glass) !important; }
        .profile-divider { height: 1px; background: var(--border); margin: 20px 0; }
        .profile-stat-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; font-size: 14px; }
        .profile-stat-row span:first-child { color: var(--text-secondary); }
        .profile-stat-row span:last-child { color: var(--text-primary); font-weight: 600; }

        /* Settings */
        .settings-content { flex: 1; overflow-y: auto; padding: 20px; }
        .settings-section { margin-bottom: 28px; }
        .settings-section h3 { font-size: 13px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 14px; }
        .theme-grid { display: flex; gap: 10px; }
        .theme-card { flex: 1; padding: 10px; background: var(--bg-glass); border: 2px solid transparent; border-radius: 16px; text-align: center; cursor: pointer; transition: all 0.25s; }
        .theme-card:hover { border-color: var(--accent); }
        .theme-card.active { border-color: var(--accent); box-shadow: 0 0 20px rgba(139,92,246,0.15); }
        .theme-preview { width: 100%; height: 56px; border-radius: 12px; margin-bottom: 8px; border: 1px solid var(--border); position: relative; overflow: hidden; }
        .theme-name { font-size: 13px; font-weight: 500; color: var(--text-primary); }

        /* Modals */
        .image-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.92); backdrop-filter: blur(20px); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 30px; }
        .image-modal.show { display: flex; animation: fadeIn 0.3s; }
        .image-modal img { max-width: 90%; max-height: 85%; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
        .image-modal-close { position: absolute; top: 20px; right: 20px; width: 42px; height: 42px; border-radius: 50%; background: var(--bg-glass); border: 1px solid var(--border); color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; transition: all 0.2s; }
        .image-modal-close:hover { background: var(--danger); border-color: var(--danger); }
        .image-modal-actions { position: absolute; top: 20px; right: 72px; display: flex; gap: 8px; }
        .image-modal-action { width: 42px; height: 42px; border-radius: 50%; background: var(--bg-glass); border: 1px solid var(--border); color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; transition: all 0.2s; text-decoration: none; }
        .image-modal-action:hover { background: var(--accent); border-color: var(--accent); }

        .profile-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); display: none; justify-content: center; align-items: center; z-index: 600; padding: 20px; }
        .profile-modal.show { display: flex; animation: fadeIn 0.3s; }
        .profile-modal-card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 24px; width: 100%; max-width: 360px; overflow: hidden; box-shadow: var(--shadow-glow); }
        .profile-modal-header { height: 100px; background: var(--accent-gradient); position: relative; }
        .profile-modal-close { position: absolute; top: 14px; right: 14px; width: 34px; height: 34px; border-radius: 50%; background: rgba(0,0,0,0.25); border: none; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 15px; }
        .profile-modal-avatar-wrap { position: relative; margin-top: -36px; padding: 0 22px; }
        .profile-modal-avatar-wrap .avatar { border: 4px solid var(--bg-secondary); box-shadow: 0 4px 20px rgba(0,0,0,0.25); }
        .profile-modal-body { padding: 16px 22px 22px; }
        .profile-modal-name { font-size: 20px; font-weight: 700; margin-bottom: 2px; }
        .profile-modal-username { color: var(--text-muted); font-size: 13px; margin-bottom: 14px; }
        .profile-modal-stat { text-align: center; padding: 12px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); margin-bottom: 16px; }
        .profile-modal-stat .value { font-size: 18px; font-weight: 700; color: var(--accent); }
        .profile-modal-stat .label { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

        /* Toast */
        .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--bg-secondary); border: 1px solid var(--border); padding: 12px 22px; border-radius: 14px; font-size: 14px; z-index: 3000; opacity: 0; transition: all 0.4s; box-shadow: 0 10px 40px rgba(0,0,0,0.4); pointer-events: none; white-space: nowrap; }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.success { border-color: var(--success); color: var(--success); }
        .toast.error { border-color: var(--danger); color: var(--danger); }

        .spinner { width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.2); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Utilities */
        .no-chat { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted); padding-bottom: 60px; }
        .no-chat i { font-size: 56px; margin-bottom: 16px; opacity: 0.3; }
        .no-chat h3 { font-size: 18px; margin-bottom: 6px; color: var(--text-secondary); }
    </style>
</head>
<body>

    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>

    <div class="app-frame">

        <!-- Auth Screen -->
        <div id="authScreen" class="screen active">
            <div class="auth-scroll">
                <div class="auth-box">
                    <div class="auth-logo">
                        <h1>Novo</h1>
                        <p>Мессенджер нового поколения</p>
                    </div>
                    <div class="auth-tabs">
                        <button class="auth-tab active" onclick="switchAuth('login')">Вход</button>
                        <button class="auth-tab" onclick="switchAuth('register')">Регистрация</button>
                    </div>
                    <form id="loginForm" onsubmit="handleLogin(event)">
                        <div class="form-group"><label>Email</label><input type="email" id="loginEmail" placeholder="your@email.com" required></div>
                        <div class="form-group"><label>Пароль</label><input type="password" id="loginPassword" placeholder="••••••••" required></div>
                        <button type="submit" class="btn-primary" id="loginBtn">Войти</button>
                        <div class="error-msg" id="loginError"></div>
                    </form>
                    <form id="registerForm" style="display:none" onsubmit="handleRegister(event)">
                        <div class="form-group"><label>Имя пользователя</label><input type="text" id="regUsername" placeholder="username" required minlength="3" maxlength="20"></div>
                        <div class="form-group"><label>Email</label><input type="email" id="regEmail" placeholder="your@email.com" required></div>
                        <div class="form-group"><label>Пароль</label><input type="password" id="regPassword" placeholder="••••••••" required minlength="6"></div>
                        <button type="submit" class="btn-primary" id="regBtn">Создать аккаунт</button>
                        <div class="error-msg" id="regError"></div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Main App -->
        <div id="mainScreen" class="screen">
            <!-- Chats Panel -->
            <div id="chatsScreen" class="main-panel active">
                <div class="screen-header"><h2>Novo</h2></div>
                <div class="search-wrap">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="searchInput" placeholder="Поиск по username..." oninput="searchUsers(this.value)">
                        <div class="search-results" id="searchResults"></div>
                    </div>
                </div>
                <div class="chat-list" id="chatList">
                    <div class="empty-state"><i class="fas fa-comments"></i><p>Начните диалог, найдя пользователя</p></div>
                </div>
            </div>

            <!-- Profile Panel -->
            <div id="profileScreen" class="main-panel">
                <div class="screen-header"><h2>Профиль</h2></div>
                <div class="profile-content">
                    <div class="profile-avatar-section">
                        <div class="avatar avatar-xl" id="editAvatar" onclick="document.getElementById('avatarInput').click()"></div>
                        <input type="file" id="avatarInput" accept="image/*" style="display:none" onchange="handleAvatarUpload(event)">
                        <div class="profile-avatar-hint">Нажмите на аватар, чтобы изменить</div>
                    </div>

                    <div class="profile-field">
                        <label>Отображаемое имя</label>
                        <input type="text" id="editDisplayName" placeholder="Ваше имя">
                    </div>
                    <div class="profile-field">
                        <label>О себе</label>
                        <textarea id="editBio" rows="3" placeholder="Расскажите о себе..."></textarea>
                    </div>
                    <button class="btn-primary" onclick="saveProfile()" style="margin-bottom: 20px;">Сохранить изменения</button>

                    <div class="profile-divider"></div>

                    <div class="profile-field">
                        <label>Username</label>
                        <input type="text" id="editUsername" class="readonly" readonly>
                    </div>
                    <div class="profile-field">
                        <label>Email</label>
                        <input type="text" id="editEmail" class="readonly" readonly>
                    </div>
                    <div class="profile-stat-row">
                        <span>В Novo</span>
                        <span id="editDays">—</span>
                    </div>
                </div>
            </div>

            <!-- Settings Panel -->
            <div id="settingsScreen" class="main-panel">
                <div class="screen-header"><h2>Настройки</h2></div>
                <div class="settings-content">
                    <div class="settings-section">
                        <h3>Тема оформления</h3>
                        <div class="theme-grid">
                            <div class="theme-card active" data-theme="default" onclick="selectTheme('default')">
                                <div class="theme-preview" style="background: #0a0a0f;"></div>
                                <div class="theme-name">Default</div>
                            </div>
                            <div class="theme-card" data-theme="black" onclick="selectTheme('black')">
                                <div class="theme-preview" style="background: #000;"></div>
                                <div class="theme-name">Black</div>
                            </div>
                            <div class="theme-card" data-theme="white" onclick="selectTheme('white')">
                                <div class="theme-preview" style="background: #f2f2f7;"></div>
                                <div class="theme-name">White</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Chat Room (Overlay) -->
            <div id="chatRoomScreen" class="chat-room">
                <div class="chat-room-header">
                    <div class="chat-room-header-info">
                        <button class="icon-btn" onclick="closeChat()" style="margin-right:4px"><i class="fas fa-arrow-left"></i></button>
                        <div class="avatar avatar-small" id="roomAvatar"></div>
                        <div>
                            <div class="chat-room-header-name" id="roomName"></div>
                            <div class="chat-room-header-status" id="roomStatus">в сети</div>
                        </div>
                    </div>
                    <div class="chat-room-actions">
                        <button class="icon-btn" onclick="toggleRoomMenu()"><i class="fas fa-ellipsis-v"></i></button>
                        <div class="dropdown-menu" id="roomMenu">
                            <div class="dropdown-item" onclick="viewRoomProfile()"><i class="fas fa-user"></i> Профиль</div>
                            <div class="dropdown-item danger" onclick="deleteRoomChat()"><i class="fas fa-trash"></i> Удалить чат</div>
                        </div>
                    </div>
                </div>
                <div class="chat-room-messages" id="roomMessages"></div>
                <div class="chat-room-input">
                    <div class="input-wrapper">
                        <button class="input-action" onclick="document.getElementById('roomImageInput').click()"><i class="fas fa-image"></i></button>
                        <input type="file" id="roomImageInput" accept="image/*" style="display:none" onchange="handleRoomImage(event)">
                        <textarea id="roomText" rows="1" placeholder="Напишите сообщение..." oninput="autoResize(this)" onkeydown="handleRoomKey(event)"></textarea>
                        <button class="send-btn" onclick="sendRoomMessage()"><i class="fas fa-paper-plane"></i></button>
                    </div>
                </div>
            </div>

            <!-- Bottom Navigation -->
            <div class="bottom-nav" id="bottomNav">
                <button class="nav-btn active" data-tab="chats" onclick="switchTab('chats')"><i class="fas fa-comment"></i></button>
                <button class="nav-btn" data-tab="profile" onclick="switchTab('profile')"><i class="fas fa-user"></i></button>
                <button class="nav-btn" data-tab="settings" onclick="switchTab('settings')"><i class="fas fa-cog"></i></button>
            </div>
        </div>

        <!-- Image Viewer -->
        <div class="image-modal" id="imageModal" onclick="if(event.target===this)closeImageModal()">
            <button class="image-modal-close" onclick="closeImageModal()"><i class="fas fa-times"></i></button>
            <div class="image-modal-actions">
                <a class="image-modal-action" id="dlImage" download title="Скачать"><i class="fas fa-download"></i></a>
            </div>
            <img id="modalImg" src="" alt="">
        </div>

        <!-- User Profile Modal -->
        <div class="profile-modal" id="userModal" onclick="if(event.target===this)closeUserModal()">
            <div class="profile-modal-card">
                <div class="profile-modal-header">
                    <button class="profile-modal-close" onclick="closeUserModal()"><i class="fas fa-times"></i></button>
                </div>
                <div class="profile-modal-avatar-wrap">
                    <div class="avatar avatar-xl" id="userModalAvatar"></div>
                </div>
                <div class="profile-modal-body">
                    <div class="profile-modal-name" id="userModalName"></div>
                    <div class="profile-modal-username" id="userModalUser"></div>
                    <div class="profile-modal-stat">
                        <div class="value" id="userModalDays">—</div>
                        <div class="label">В Novo</div>
                    </div>
                    <div style="display:flex;gap:10px;">
                        <button class="btn-primary" id="userModalAction" style="flex:1;font-size:14px;padding:12px;">Написать</button>
                        <button class="btn-primary" onclick="closeUserModal()" style="flex:1;font-size:14px;padding:12px;background:var(--bg-glass);color:var(--text-primary);">Закрыть</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Toast -->
        <div class="toast" id="toast"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getDatabase, ref, set, get, push, onValue, update, remove, query, orderByChild, equalTo } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyANPnto5M6Y9GBLX3akAbQ3UX4CAiVI3c8",
            authDomain: "tigrai.firebaseapp.com",
            databaseURL: "https://tigrai-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "tigrai",
            storageBucket: "tigrai.firebasestorage.app",
            messagingSenderId: "810876313696",
            appId: "1:810876313696:web:a0ba29e51a3532a91ce305",
            measurementId: "G-ZXB03SSX9S"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        window.currentUser = null;
        window.currentUserData = null;
        window.currentChatId = null;
        window.currentChatUser = null;
        window.messagesUnsub = null;
        window.chatsUnsub = null;

        /* ---------- Theme System ---------- */
        function applyTheme(theme) {
            document.body.setAttribute('data-theme', theme);
            const r = document.documentElement.style;
            if (theme === 'black') {
                r.setProperty('--bg-primary','#000'); r.setProperty('--bg-secondary','#0a0a0a');
                r.setProperty('--bg-glass','rgba(255,255,255,0.03)'); r.setProperty('--bg-glass-hover','rgba(255,255,255,0.06)');
                r.setProperty('--input-bg','rgba(255,255,255,0.03)'); r.setProperty('--bubble-other','rgba(255,255,255,0.03)');
                r.setProperty('--text-primary','#fff'); r.setProperty('--text-secondary','#888');
                r.setProperty('--text-muted','#555'); r.setProperty('--border','rgba(255,255,255,0.06)');
            } else if (theme === 'white') {
                r.setProperty('--bg-primary','#f2f2f7'); r.setProperty('--bg-secondary','#ffffff');
                r.setProperty('--bg-glass','rgba(0,0,0,0.04)'); r.setProperty('--bg-glass-hover','rgba(0,0,0,0.07)');
                r.setProperty('--input-bg','rgba(0,0,0,0.03)'); r.setProperty('--bubble-other','#e5e5ea');
                r.setProperty('--text-primary','#1c1c1e'); r.setProperty('--text-secondary','#8e8e93');
                r.setProperty('--text-muted','#aeaeb2'); r.setProperty('--border','rgba(0,0,0,0.08)');
            } else {
                r.setProperty('--bg-primary','#0a0a0f'); r.setProperty('--bg-secondary','#12121a');
                r.setProperty('--bg-glass','rgba(255,255,255,0.05)'); r.setProperty('--bg-glass-hover','rgba(255,255,255,0.08)');
                r.setProperty('--input-bg','rgba(255,255,255,0.04)'); r.setProperty('--bubble-other','rgba(255,255,255,0.05)');
                r.setProperty('--text-primary','#f1f1f4'); r.setProperty('--text-secondary','#9ca3af');
                r.setProperty('--text-muted','#6b7280'); r.setProperty('--border','rgba(255,255,255,0.08)');
            }
        }

        window.selectTheme = async function(theme) {
            applyTheme(theme);
            document.querySelectorAll('.theme-card').forEach(c => c.classList.toggle('active', c.dataset.theme === theme));
            if (window.currentUser) {
                await update(ref(db, 'users/' + window.currentUser.uid), { theme });
            }
            localStorage.setItem('novo_theme', theme);
        };

        /* ---------- Auth ---------- */
        window.switchAuth = function(type) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('loginForm').style.display = type === 'login' ? 'block' : 'none';
            document.getElementById('registerForm').style.display = type === 'register' ? 'block' : 'none';
            document.getElementById('loginError').classList.remove('show');
            document.getElementById('regError').classList.remove('show');
        };

        function toast(msg, type='success') {
            const t = document.getElementById('toast');
            t.textContent = msg; t.className = 'toast show ' + type;
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        window.handleRegister = async function(e) {
            e.preventDefault();
            const btn = document.getElementById('regBtn');
            const err = document.getElementById('regError');
            const username = document.getElementById('regUsername').value.trim().toLowerCase();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;

            if (!/^[a-z0-9_]+$/.test(username)) {
                err.textContent = 'Только a-z, 0-9 и _'; err.classList.add('show'); return;
            }

            btn.innerHTML = '<span class="spinner"></span>'; btn.disabled = true;
            try {
                const uSnap = await get(ref(db, 'usernames/' + username));
                if (uSnap.exists()) { err.textContent = 'Username занят'; err.classList.add('show'); btn.innerHTML='Создать аккаунт'; btn.disabled=false; return; }

                const cred = await createUserWithEmailAndPassword(auth, email, password);
                const uid = cred.user.uid;
                await set(ref(db, 'users/' + uid), {
                    username, email, createdAt: Date.now(), displayName: '', bio: '', avatar: null, theme: 'default'
                });
                await set(ref(db, 'usernames/' + username), uid);
                toast('Аккаунт создан!');
            } catch(e) { err.textContent = e.message; err.classList.add('show'); }
            btn.innerHTML = 'Создать аккаунт'; btn.disabled = false;
        };

        window.handleLogin = async function(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const err = document.getElementById('loginError');
            btn.innerHTML = '<span class="spinner"></span>'; btn.disabled = true;
            try {
                await signInWithEmailAndPassword(auth, document.getElementById('loginEmail').value, document.getElementById('loginPassword').value);
            } catch(e) { err.textContent = e.message; err.classList.add('show'); }
            btn.innerHTML = 'Войти'; btn.disabled = false;
        };

        window.logout = async function() {
            await signOut(auth); location.reload();
        };

        onAuthStateChanged(auth, async (user) => {
            if (!user) return;
            window.currentUser = user;
            const snap = await get(ref(db, 'users/' + user.uid));
            window.currentUserData = snap.val() || {};
            const savedTheme = window.currentUserData.theme || localStorage.getItem('novo_theme') || 'default';
            applyTheme(savedTheme);

            document.getElementById('authScreen').classList.remove('active');
            document.getElementById('mainScreen').classList.add('active');
            loadChats();
            prepMyProfile();
            markThemeActive(savedTheme);
        });

        /* ---------- Navigation ---------- */
        window.switchTab = function(tab) {
            document.querySelectorAll('.main-panel').forEach(p => p.classList.remove('active'));
            document.getElementById(tab + 'Screen').classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.querySelector('.nav-btn[data-tab="'+tab+'"]').classList.add('active');
            if (tab === 'profile') prepMyProfile();
        };

        /* ---------- Chats ---------- */
        window.searchUsers = async function(q) {
            const res = document.getElementById('searchResults');
            if (!q || q.length < 2) { res.classList.remove('show'); return; }
            const snap = await get(ref(db, 'users'));
            const matches = [];
            snap.forEach(c => {
                const d = c.val();
                if (d.username && d.username.includes(q.toLowerCase()) && c.key !== window.currentUser.uid)
                    matches.push({ uid: c.key, ...d });
            });
            res.innerHTML = '';
            if (!matches.length) res.innerHTML = '<div class="search-result-item"><span style="color:var(--text-muted)">Ничего не найдено</span></div>';
            else matches.forEach(u => {
                const d = document.createElement('div'); d.className = 'search-result-item';
                d.innerHTML = `<div class="avatar avatar-small">${u.username[0].toUpperCase()}</div><div style="font-weight:600;font-size:14px">@${u.username}</div>`;
                d.onclick = () => startChat(u.uid, u.username);
                res.appendChild(d);
            });
            res.classList.add('show');
        };

        async function startChat(otherUid, otherUsername) {
            document.getElementById('searchResults').classList.remove('show');
            document.getElementById('searchInput').value = '';
            const qry = query(ref(db, 'userChats/' + window.currentUser.uid), orderByChild('otherUserId'), equalTo(otherUid));
            const snap = await get(qry);
            if (snap.exists()) {
                const id = Object.keys(snap.val())[0];
                openChat(id, otherUid, snap.val()[id].otherUsername || otherUsername);
            } else {
                const cref = push(ref(db, 'chats'));
                const cid = cref.key, ts = Date.now();
                const me = window.currentUserData.username || 'user';
                await set(cref, { participants: { [window.currentUser.uid]: true, [otherUid]: true }, createdAt: ts });
                await set(ref(db, 'userChats/' + window.currentUser.uid + '/' + cid), { otherUserId: otherUid, otherUsername, lastMessage: '', timestamp: ts, unread: 0 });
                await set(ref(db, 'userChats/' + otherUid + '/' + cid), { otherUserId: window.currentUser.uid, otherUsername: me, lastMessage: '', timestamp: ts, unread: 0 });
                openChat(cid, otherUid, otherUsername);
            }
        }

        function loadChats() {
            if (window.chatsUnsub) { window.chatsUnsub(); window.chatsUnsub = null; }
            const list = document.getElementById('chatList');
            window.chatsUnsub = onValue(ref(db, 'userChats/' + window.currentUser.uid), (snap) => {
                const arr = [];
                snap.forEach(c => arr.push({ id: c.key, ...c.val() }));
                arr.sort((a,b) => (b.timestamp||0)-(a.timestamp||0));
                if (!arr.length) {
                    list.innerHTML = `<div class="empty-state"><i class="fas fa-comments"></i><p>Начните диалог, найдя пользователя</p></div>`; return;
                }
                list.innerHTML = '';
                arr.forEach(c => {
                    const el = document.createElement('div'); el.className = 'chat-item' + (c.id===window.currentChatId?' active':'');
                    const name = c.otherUsername || 'Пользователь';
                    const init = (name[0]||'?').toUpperCase();
                    const time = c.timestamp ? fmtTime(c.timestamp) : '';
                    el.innerHTML = `
                        <div class="avatar avatar-small">${init}</div>
                        <div class="chat-info"><div class="chat-name">@${name}</div><div class="chat-preview">${c.lastMessage||'Начните общение'}</div></div>
                        <div class="chat-meta"><div class="chat-time">${time}</div>${c.unread>0?`<span class="unread">${c.unread}</span>`:''}</div>
                    `;
                    el.onclick = () => openChat(c.id, c.otherUserId, c.otherUsername);
                    list.appendChild(el);
                });
            });
        }

        /* ---------- Chat Room ---------- */
        window.openChat = async function(chatId, otherUid, otherUsername) {
            if (!chatId) return;
            if (!otherUsername && otherUid) {
                try { otherUsername = (await get(ref(db, 'users/'+otherUid))).val()?.username||'unknown'; }
                catch(e){ otherUsername='unknown'; }
            }
            otherUsername = otherUsername || 'unknown';
            window.currentChatId = chatId;
            window.currentChatUser = { uid: otherUid, username: otherUsername };

            document.getElementById('roomName').textContent = '@' + otherUsername;
            document.getElementById('roomAvatar').textContent = (otherUsername[0]||'?').toUpperCase();
            document.getElementById('chatRoomScreen').classList.add('show');
            document.getElementById('bottomNav').style.display = 'none';

            await update(ref(db, 'userChats/' + window.currentUser.uid + '/' + chatId), { unread: 0 });

            const box = document.getElementById('roomMessages');
            box.innerHTML = '';
            if (window.messagesUnsub) { window.messagesUnsub(); window.messagesUnsub = null; }

            window.messagesUnsub = onValue(ref(db, 'messages/' + chatId), (snap) => {
                box.innerHTML = ''; let lastDate = null;
                if (!snap.exists()) return;
                snap.forEach(c => {
                    const m = c.val(); if (!m) return;
                    const d = m.timestamp ? new Date(m.timestamp).toLocaleDateString('ru-RU') : '';
                    if (d && d!==lastDate) {
                        const s = document.createElement('div'); s.className='date-separator'; s.innerHTML=`<span>${d}</span>`; box.appendChild(s); lastDate=d;
                    }
                    const own = m.sender === window.currentUser.uid;
                    const g = document.createElement('div'); g.className = 'message-group' + (own?' own':'');
                    let html = '';
                    if (m.type==='image' && m.image) html = `<img src="${m.image}" class="message-image" onclick="openImageModal('${m.image}')">`;
                    else html = `<div class="message-bubble">${esc(m.text||'')}</div>`;
                    g.innerHTML = html + `<div class="message-time">${fmtTime(m.timestamp)}</div>`;
                    box.appendChild(g);
                });
                box.scrollTop = box.scrollHeight;
            });
        };

        window.closeChat = function() {
            document.getElementById('chatRoomScreen').classList.remove('show');
            document.getElementById('bottomNav').style.display = 'flex';
            if (window.messagesUnsub) { window.messagesUnsub(); window.messagesUnsub = null; }
            document.getElementById('roomMessages').innerHTML = '';
            window.currentChatId = null; window.currentChatUser = null;
        };

        window.sendRoomMessage = async function() {
            const inp = document.getElementById('roomText');
            const text = inp.value.trim();
            if (!text || !window.currentChatId) return;
            inp.value = ''; autoResize(inp);
            const ts = Date.now();
            await push(ref(db, 'messages/' + window.currentChatId), { sender: window.currentUser.uid, text, type: 'text', timestamp: ts });
            const upd = {};
            upd['userChats/'+window.currentUser.uid+'/'+window.currentChatId+'/lastMessage'] = text;
            upd['userChats/'+window.currentUser.uid+'/'+window.currentChatId+'/timestamp'] = ts;
            upd['userChats/'+window.currentChatUser.uid+'/'+window.currentChatId+'/lastMessage'] = text;
            upd['userChats/'+window.currentChatUser.uid+'/'+window.currentChatId+'/timestamp'] = ts;
            const oth = await get(ref(db, 'userChats/'+window.currentChatUser.uid+'/'+window.currentChatId));
            upd['userChats/'+window.currentChatUser.uid+'/'+window.currentChatId+'/unread'] = (oth.val()?.unread||0)+1;
            await update(ref(db), upd);
        };

        window.handleRoomImage = function(e) {
            const f = e.target.files[0]; if (!f) return;
            const r = new FileReader();
            r.onload = async (ev) => {
                const b64 = ev.target.result;
                if (b64.length > 2000000) { toast('Фото слишком большое','error'); return; }
                if (!window.currentChatId) return;
                const ts = Date.now();
                await push(ref(db, 'messages/' + window.currentChatId), { sender: window.currentUser.uid, image: b64, type: 'image', timestamp: ts });
                const upd = {};
                upd['userChats/'+window.currentUser.uid+'/'+window.currentChatId+'/lastMessage']='📷 Фото';
                upd['userChats/'+window.currentUser.uid+'/'+window.currentChatId+'/timestamp']=ts;
                upd['userChats/'+window.currentChatUser.uid+'/'+window.currentChatId+'/lastMessage']='📷 Фото';
                upd['userChats/'+window.currentChatUser.uid+'/'+window.currentChatId+'/timestamp']=ts;
                const oth = await get(ref(db, 'userChats/'+window.currentChatUser.uid+'/'+window.currentChatId));
                upd['userChats/'+window.currentChatUser.uid+'/'+window.currentChatId+'/unread']=(oth.val()?.unread||0)+1;
                await update(ref(db), upd); toast('Фото отправлено');
            };
            r.readAsDataURL(f); e.target.value='';
        };

        window.handleRoomKey = function(e) { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendRoomMessage(); } };
        window.autoResize = function(el) { el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,100)+'px'; };

        /* ---------- Room Menu ---------- */
        window.toggleRoomMenu = function() { document.getElementById('roomMenu').classList.toggle('show'); };
        document.addEventListener('click', e => {
            if (!e.target.closest('.chat-room-actions')) document.getElementById('roomMenu').classList.remove('show');
            if (!e.target.closest('.search-wrap')) document.getElementById('searchResults').classList.remove('show');
        });

        window.deleteRoomChat = async function() {
            if (!window.currentChatId) return;
            if (!confirm('Удалить чат?')) return;
            await remove(ref(db, 'userChats/' + window.currentUser.uid + '/' + window.currentChatId));
            closeChat(); toast('Чат удалён');
        };

        window.viewRoomProfile = function() {
            document.getElementById('roomMenu').classList.remove('show');
            if (window.currentChatUser) showUserModal(window.currentChatUser.uid);
        };

        /* ---------- My Profile ---------- */
        function prepMyProfile() {
            const d = window.currentUserData || {};
            const el = document.getElementById('editAvatar');
            if (d.avatar) el.innerHTML = `<img src="${d.avatar}" style="width:100%;height:100%;object-fit:cover;">`;
            else el.textContent = (d.username?.[0]||'?').toUpperCase();

            document.getElementById('editDisplayName').value = d.displayName || '';
            document.getElementById('editBio').value = d.bio || '';
            document.getElementById('editUsername').value = '@' + (d.username || '');
            document.getElementById('editEmail').value = d.email || '';
            document.getElementById('editDays').textContent = d.createdAt ? Math.floor((Date.now()-d.createdAt)/86400000)+' дн.' : '—';
        }

        window.handleAvatarUpload = function(e) {
            const f = e.target.files[0]; if (!f) return;
            const r = new FileReader();
            r.onload = async (ev) => {
                const b64 = ev.target.result;
                if (b64.length > 2000000) { toast('Слишком большое','error'); return; }
                await update(ref(db, 'users/'+window.currentUser.uid), { avatar: b64 });
                window.currentUserData.avatar = b64;
                document.getElementById('editAvatar').innerHTML = `<img src="${b64}" style="width:100%;height:100%;object-fit:cover;">`;
                toast('Аватар обновлён');
            };
            r.readAsDataURL(f);
        };

        window.saveProfile = async function() {
            const displayName = document.getElementById('editDisplayName').value.trim();
            const bio = document.getElementById('editBio').value.trim();
            await update(ref(db, 'users/'+window.currentUser.uid), { displayName, bio });
            window.currentUserData.displayName = displayName;
            window.currentUserData.bio = bio;
            toast('Профиль сохранён');
        };

        /* ---------- User Modal ---------- */
        window.showUserModal = async function(uid) {
            const s = await get(ref(db, 'users/'+uid)); if (!s.exists()) return;
            const u = s.val();
            document.getElementById('userModalAvatar').innerHTML = u.avatar ? `<img src="${u.avatar}" style="width:100%;height:100%;object-fit:cover;">` : (u.username?.[0]||'?').toUpperCase();
            document.getElementById('userModalName').textContent = u.displayName || u.username || 'Unknown';
            document.getElementById('userModalUser').textContent = '@' + (u.username||'unknown');
            document.getElementById('userModalDays').textContent = u.createdAt ? Math.floor((Date.now()-u.createdAt)/86400000)+' дн.' : '—';
            const btn = document.getElementById('userModalAction');
            if (uid === window.currentUser.uid) {
                btn.textContent = 'Закрыть'; btn.onclick = closeUserModal;
            } else {
                btn.textContent = 'Написать'; btn.onclick = () => { closeUserModal(); startChat(uid, u.username); };
            }
            document.getElementById('userModal').classList.add('show');
        };
        window.closeUserModal = function() { document.getElementById('userModal').classList.remove('show'); };

        /* ---------- Image Modal ---------- */
        window.openImageModal = function(src) {
            document.getElementById('modalImg').src = src;
            document.getElementById('dlImage').href = src;
            document.getElementById('imageModal').classList.add('show');
        };
        window.closeImageModal = function() { document.getElementById('imageModal').classList.remove('show'); };

        /* ---------- Helpers ---------- */
        function markThemeActive(t) {
            document.querySelectorAll('.theme-card').forEach(c => c.classList.toggle('active', c.dataset.theme === t));
        }
        function fmtTime(ts) { if (!ts) return ''; const d=new Date(ts); return d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}); }
        function esc(t) { const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }
    </script>
</body>
</html>
